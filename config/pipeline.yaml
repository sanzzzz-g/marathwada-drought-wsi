# Marathwada Drought Water Stress Index (WSI) Pipeline Configuration
project:
  name: "marathwada-drought-wsi"
  description: "Six-stream authoritative data engineering pipeline for monthly drought stress monitoring"

districts:
  - "Beed"
  - "Chhatrapati Sambhajinagar"
  - "Dharashiv"
  - "Hingoli"
  - "Jalna"
  - "Latur"
  - "Nanded"
  - "Parbhani"

district_aliases:
  "Bid": "Beed"
  "Aurangabad": "Chhatrapati Sambhajinagar"
  "Osmanabad": "Dharashiv"

dates:
  canonical_start: "2003-01-01"
  canonical_end: "2024-12-01"
  total_months: 264
  total_district_months: 2112

splits:
  row_level:
    train:
      start: "2003-01-01"
      end: "2017-12-01"
      months: 180
      rows: 1440
    validation:
      start: "2018-01-01"
      end: "2020-12-01"
      months: 36
      rows: 288
    test:
      start: "2021-01-01"
      end: "2024-12-01"
      months: 48
      rows: 384
  forecast_origin:
    lookback_window_months: 12
    forecast_horizon_months: 3
    last_train_origin: "2017-09-01"
    first_val_origin: "2018-01-01"
    first_test_origin: "2021-01-01"

raw_data:
  chirps: "data/marathwada_chirps_monthly_rainfall_1981_2026.csv"
  era5land: "data/marathwada_era5land_soil_water_2000_2026.csv"
  ndvi: "data/marathwada_mod13q1_monthly_ndvi_2000_2025.csv"
  lst: "data/marathwada_mod11a2_monthly_lst_2000_2025.csv"
  gwp: "data/marathwada_gwp_monthly_surface_water_2003_2024.csv"
  groundwater: "data/marathwada_groundwater_extracted.csv"

qc:
  parbhani_july_2022_ndvi_raw_artifact: 0.122442
  groundwater:
    min_qualifying_wells: 10
    staleness_threshold_months: 3
    sensitivity_thresholds: [5, 10, 15]
  gwp:
    use_lag_1: false  # Can be toggled to true if strict lag-1 cutoff is required

spi:
  window_months: 3
  distribution: "gamma"
  fit_method: "mle"
  lower_bound_floc: 0.0
  calibration_start: "1981-01-01"
  calibration_end: "2017-12-01"

wsi:
  component_weights:
    spi_stress_z: 0.16666666666666666
    soil_stress_z: 0.16666666666666666
    ndvi_stress_z: 0.16666666666666666
    lst_stress_z: 0.16666666666666666
    groundwater_stress_z: 0.16666666666666666
    surface_water_stress_z: 0.16666666666666666
  categories:
    very_wet:
      max: -1.5
      label: "Very Wet"
    wet:
      min: -1.5
      max: -0.5
      label: "Wet"
    normal:
      min: -0.5
      max: 0.5
      label: "Normal"
    moderate_stress:
      min: 0.5
      max: 1.5
      label: "Moderate Stress"
    severe_stress:
      min: 1.5
      label: "Severe Stress"

outputs:
  master_parquet: "outputs/Marathwada_MASTER_2003_2024.parquet"
  master_audit_csv: "outputs/Marathwada_MASTER_AUDIT_DATASET_2003_2024.csv"
  model_csv: "outputs/Marathwada_MODEL_DATASET_2003_2024.csv"
  train_statistics_json: "artifacts/train_statistics.json"
  validation_report_json: "artifacts/validation_report.json"
  preprocessing_metadata_json: "artifacts/preprocessing_metadata.json"

